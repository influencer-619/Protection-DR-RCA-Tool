version: "1.0.0"
# Hypothesis IDs are stable. EXTERNAL_LINE_FAULT is displayed as "Protected circuit fault"
# (scheme-agnostic electrical fault cleared by protection — not distance-only).
#
# Zone matching (engine-enforced):
#   21 / 87L  → EXTERNAL_LINE_FAULT (+ lightning/vegetation/flashover/cable when evidence)
#   50/51/EF  → INTERNAL_FEEDER_FAULT (+ same causes when evidence)
#   87T/87RGF → TRANSFORMER_INTERNAL_FAULT (CT sat as competing instrumentation hyp)
#   87B       → BUS_ZONE_FAULT
#   87G       → GENERATOR_INTERNAL_FAULT
# Wrong-zone hyps are ranked UNLIKELY. Cause hyps without field evidence stay INCONCLUSIVE.
scoring_weights:
  deterministic: 0.50
  consistency: 0.20
  electrical: 0.15
  ml: 0.10
  similarity: 0.05
hypotheses:
  - id: EXTERNAL_LINE_FAULT
    required_for_confirmed:
      - fault_classified
      - protection_operated
      - current_increase_observed
  - id: INTERNAL_FEEDER_FAULT
    required_for_confirmed:
      - fault_classified
      - protection_operated
  - id: CABLE_FAULT
    required_for_confirmed:
      - fault_classified
      - cable_asset_confirmed
  - id: TRANSFORMER_INTERNAL_FAULT
    required_for_confirmed:
      - differential_operated
      - through_fault_excluded
  - id: BUS_ZONE_FAULT
    required_for_confirmed:
      - bus_diff_operated
      - fault_classified
  - id: GENERATOR_INTERNAL_FAULT
    required_for_confirmed:
      - generator_diff_operated
      - fault_classified
  - id: LIGHTNING
    required_for_confirmed:
      - lightning_evidence
  - id: VEGETATION
    required_for_confirmed:
      - field_report_vegetation
  - id: INSULATION_FLASHOVER
    required_for_confirmed:
      - insulation_evidence
  - id: CT_SATURATION
    required_for_confirmed:
      - waveform_distortion
      - harmonic_evidence
  - id: VT_CVT_ABNORMALITY
    required_for_confirmed:
      - voltage_channel_anomaly
  - id: PROTECTION_SETTING_ERROR
    required_for_confirmed:
      - setting_verified
      - inconsistency_with_verified_settings
  - id: RELAY_CONFIGURATION_ERROR
    required_for_confirmed:
      - configuration_verified
      - mismatch_documented
  - id: RELAY_MISOPERATION
    required_for_confirmed:
      - settings_verified
      - electrical_no_fault
      - trip_observed
  - id: BREAKER_FAILURE
    required_for_confirmed:
      - trip_command_observed
      - current_persists
      - bf_logic_satisfied
  - id: COMMUNICATION_FAILURE
    required_for_confirmed:
      - comm_channel_evidence
  - id: INTERTRIP_OPERATION
    required_for_confirmed:
      - intertrip_signal_observed
  - id: SWITCHING_TRANSIENT
    required_for_confirmed:
      - switching_event_correlated
  - id: SWITCH_ONTO_FAULT
    # Close / energize into a pre-existing or concurrent shunt fault (SOTF).
    # Distinct from energization/inrush (no trip) and from zone-only fault labels.
    required_for_confirmed:
      - fault_classified
      - protection_operated
      - switch_onto_fault_context
  - id: MOTOR_START
    required_for_confirmed:
      - motor_start_possible
  - id: MOTOR_LOCKED_ROTOR
    required_for_confirmed:
      - locked_rotor_indicated
  - id: MOTOR_LOAD_JAM
    required_for_confirmed:
      - load_jam_indicated
  - id: HIGH_IMPEDANCE_FAULT
    required_for_confirmed:
      - high_impedance_fault_indicated
  - id: INTERMITTENT_EARTH_FAULT
    required_for_confirmed:
      - intermittent_earth_indicated
  - id: TEMPORARY_FAULT_RECLOSE
    required_for_confirmed:
      - autoreclose_success
  - id: PERSISTENT_FAULT_RECLOSE
    required_for_confirmed:
      - autoreclose_fail
  - id: OVEREXCITATION
    required_for_confirmed:
      - overflux_operated
  - id: THERMAL_OVERLOAD
    required_for_confirmed:
      - thermal_overload_indicated
  - id: PHASE_LOSS
    required_for_confirmed:
      - phase_loss_indicated
  - id: NEGATIVE_SEQUENCE
    required_for_confirmed:
      - negative_sequence_elevated
  - id: LOSS_OF_EXCITATION
    required_for_confirmed:
      - loss_of_excitation_operated
  - id: FREQUENCY_EVENT
    required_for_confirmed:
      - frequency_protection_operated
  - id: OUT_OF_STEP
    required_for_confirmed:
      - out_of_step_operated
  - id: ACCIDENTAL_ENERGIZATION
    required_for_confirmed:
      - accidental_energization_indicated
  - id: CAPACITOR_BANK_FAULT
    required_for_confirmed:
      - capacitor_unbalance_operated
  - id: OVERVOLTAGE
    required_for_confirmed:
      - overvoltage_operated
  - id: TRIP_CIRCUIT_FAILURE
    required_for_confirmed:
      - trip_circuit_fail
  - id: BREAKER_MECHANICAL_FAILURE
    required_for_confirmed:
      - breaker_stuck
  - id: EXTERNAL_GRID_DISTURBANCE
    required_for_confirmed:
      - external_event_correlated
  - id: UNKNOWN
    required_for_confirmed: []
