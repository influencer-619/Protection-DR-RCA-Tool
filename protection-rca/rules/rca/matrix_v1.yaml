guardrails:
  - id: GR_NO_BUS_WITHOUT_87B
    description: "Cascade / feeder events must not surface BUS_ZONE_FAULT without bus_diff_operated"
    when_any: [cascade_lbb_detected, fault_classified, protection_operated]
    unless: [bus_diff_operated]
    demote_hypothesis: BUS_ZONE_FAULT
    demote_to: UNLIKELY
    reason: "No 87B / bus-diff evidence — bus fault excluded (matrix guardrail)"
