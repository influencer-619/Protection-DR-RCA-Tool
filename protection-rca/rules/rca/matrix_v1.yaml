# Versioned RCA scenario matrix (FULL Excel pack — 54 scenarios).
# Source: Complete_Generalized_Protection_RCA_Matrix_L1_L2_L3_Fallback_LBB.xlsx
# Generated by backend/scripts/generate_full_matrix_yaml.py — do not hand-trim rows.
# Consumed by rca.matrix.match_matrix; does NOT replace hypotheses.yaml IDs.
version: "1.1.0"
source: "Complete_Generalized_Protection_RCA_Matrix_L1_L2_L3_Fallback_LBB.xlsx"
source_scenario_count: 54
engine: HypothesisEngine

layers:
  L1: "Relay digitals / protection operations (ANSI assert)"
  L2: "SOE / event report timeline merge"
  L3: "COMTRADE DR — waveforms, electrical, fault features"

fallback_methodology:
  - level: "L1 - Relay"
    rule: "Never infer a missing relay bit as if it existed."
  - level: "L2 - SOE"
    rule: "Reconstruct chronological causality from timestamps."
  - level: "L3 - DR"
    rule: "Waveform-derived evidence may replace a missing dedicated indication."
  - level: "Topology"
    rule: "Location claims require topology context."
  - level: "LBB"
    rule: "Do not call a cascade a bus fault without independent bus-fault evidence."
  - level: "Inrush"
    rule: "Harmonics support the diagnosis but are not mandatory."
  - level: "In-zone"
    rule: "Label inferred zone decisions appropriately."
  - level: "Confidence"
    rule: "CONFIRMED / PROBABLE / POSSIBLE / NOT CONFIRMED."

rca_taxonomy:
  - classification: "CONFIRMED"
    meaning: "Independent evidence agrees across relay/SOE/DR or equivalent fallback paths"
  - classification: "PROBABLE"
    meaning: "Strong physical and chronological evidence but one important signal/channel is missing"
  - classification: "POSSIBLE"
    meaning: "Plausible but insufficient to distinguish from alternatives"
  - classification: "NOT CONFIRMED"
    meaning: "Declared by relay/event but physical evidence does not support it"
  - classification: "BREAKER FAILURE / LBB"
    meaning: "Primary fault exists but local breaker fails and backup clears"
  - classification: "CASCADE / BACKUP CLEARING"
    meaning: "Multiple breakers operate as consequence of failed/backup clearing"
  - classification: "INSTRUMENTATION ISSUE"
    meaning: "CT/VT/channel problem likely explains protection declaration"
  - classification: "CONTROL / LOGIC ISSUE"
    meaning: "Trip or blocking sequence inconsistent with physical fault"
  - classification: "PROTECTION MALOPERATION SUSPECTED"
    meaning: "Protection operation lacks physical/system support after instrumentation/control checks"

# IEEE / Excel LBB Cascade Logic (10 steps)
lbb_steps:
  - id: 1
    label: "Credible primary fault signature"
    any_of:
      - fault_classified
      - fault_classified_strong
      - current_increase_observed
  - id: 2
    label: "Primary protection START/OPERATE"
    any_of:
      - protection_operated
      - trip_observed
  - id: 3
    label: "Trip command to local breaker"
    any_of:
      - trip_command_observed
      - trip_observed
  - id: 4
    label: "Local breaker status / open confirmation"
    any_of:
      - breaker_open_confirmed
      - successful_clearing
  - id: 5
    label: "Current persistence / failed clear"
    any_of:
      - current_persists
      - bf_logic_satisfied
  - id: 6
    label: "50BF / LBB element operates"
    any_of:
      - bf_logic_satisfied
      - cascade_lbb_detected
  - id: 7
    label: "Intertrip / transfer-trip SEND"
    any_of:
      - intertrip_send_observed
      - intertrip_signal_observed
  - id: 8
    label: "Upstream / backup receives intertrip"
    any_of:
      - intertrip_receive_observed
      - cascade_upstream_clearance
  - id: 9
    label: "Backup trip / clearance"
    any_of:
      - protection_operated
      - cascade_upstream_clearance
      - successful_clearing
  - id: 10
    label: "Bus-zone fault excluded without 87B"
    forbid: [bus_diff_operated]
    require_absent_for_pass: true
    note: "Pass when bus_diff_operated is absent (Excel: not automatically a bus fault)"

